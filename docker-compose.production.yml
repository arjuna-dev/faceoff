name: faceoff-production

services:
  postgres:
    image: postgres:16.8-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env.production}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
    volumes:
      - faceoff_postgres_production:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true
    shm_size: 256m
    mem_limit: 1g
    networks:
      - faceoff

  nakama:
    image: registry.heroiclabs.com/heroiclabs/nakama:3.40.0
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        node_base="$${NAKAMA_NODE_NAME:-faceoff}";
        node_suffix="$$(hostname | tr -cd '[:alnum:]' | cut -c1-7)";
        node_name="$${node_base}-$${node_suffix}";
        node_name="$$(printf '%s' "$$node_name" | cut -c1-16)";
        /nakama/nakama migrate up --database.address "$${NAKAMA_DATABASE_ADDRESS}" &&
        exec /nakama/nakama --config /nakama/data/production.yml
        --name "$$node_name"
        --database.address "$${NAKAMA_DATABASE_ADDRESS}"
        --socket.server_key "$${NAKAMA_SERVER_KEY}"
        --session.encryption_key "$${NAKAMA_SESSION_ENCRYPTION_KEY}"
        --session.refresh_encryption_key "$${NAKAMA_REFRESH_ENCRYPTION_KEY}"
        --runtime.http_key "$${NAKAMA_RUNTIME_HTTP_KEY}"
        --console.signing_key "$${NAKAMA_CONSOLE_SIGNING_KEY}"
        --console.username "$${NAKAMA_CONSOLE_USERNAME}"
        --console.password "$${NAKAMA_CONSOLE_PASSWORD}"
        --runtime.env "TWILIO_ACCOUNT_SID=$${TWILIO_ACCOUNT_SID}"
        --runtime.env "TWILIO_AUTH_TOKEN=$${TWILIO_AUTH_TOKEN}"
        --runtime.env "TWILIO_VERIFY_SERVICE_SID=$${TWILIO_VERIFY_SERVICE_SID}"
        --runtime.env "TWILIO_VERIFY_CHANNEL=$${TWILIO_VERIFY_CHANNEL}"
        --runtime.env "FACE_OFF_SMS_BUDGET_EUR=$${FACE_OFF_SMS_BUDGET_EUR}"
        --runtime.env "FACE_OFF_SMS_ALERT_EUR=$${FACE_OFF_SMS_ALERT_EUR}"
        --runtime.env "FACE_OFF_SMS_ESTIMATE_EUR=$${FACE_OFF_SMS_ESTIMATE_EUR}"
    environment:
      NAKAMA_DATABASE_ADDRESS: postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_VERIFY_SERVICE_SID: ${TWILIO_VERIFY_SERVICE_SID:-}
      TWILIO_VERIFY_CHANNEL: ${TWILIO_VERIFY_CHANNEL:-sms}
      FACE_OFF_SMS_BUDGET_EUR: ${FACE_OFF_SMS_BUDGET_EUR:-10}
      FACE_OFF_SMS_ALERT_EUR: ${FACE_OFF_SMS_ALERT_EUR:-6}
      FACE_OFF_SMS_ESTIMATE_EUR: ${FACE_OFF_SMS_ESTIMATE_EUR:-0.20}
      NAKAMA_NODE_NAME: ${NAKAMA_NODE_NAME:-faceoff}
      NAKAMA_SERVER_KEY: ${NAKAMA_SERVER_KEY:?set NAKAMA_SERVER_KEY in .env.production}
      NAKAMA_SESSION_ENCRYPTION_KEY: ${NAKAMA_SESSION_ENCRYPTION_KEY:?set NAKAMA_SESSION_ENCRYPTION_KEY in .env.production}
      NAKAMA_REFRESH_ENCRYPTION_KEY: ${NAKAMA_REFRESH_ENCRYPTION_KEY:?set NAKAMA_REFRESH_ENCRYPTION_KEY in .env.production}
      NAKAMA_RUNTIME_HTTP_KEY: ${NAKAMA_RUNTIME_HTTP_KEY:?set NAKAMA_RUNTIME_HTTP_KEY in .env.production}
      NAKAMA_CONSOLE_SIGNING_KEY: ${NAKAMA_CONSOLE_SIGNING_KEY:?set NAKAMA_CONSOLE_SIGNING_KEY in .env.production}
      NAKAMA_CONSOLE_USERNAME: ${NAKAMA_CONSOLE_USERNAME:?set NAKAMA_CONSOLE_USERNAME in .env.production}
      NAKAMA_CONSOLE_PASSWORD: ${NAKAMA_CONSOLE_PASSWORD:?set NAKAMA_CONSOLE_PASSWORD in .env.production}
    volumes:
      - ./nakama:/nakama/data:ro
    expose:
      - "7350"
      - "9100"
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    networks:
      - faceoff

  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    environment:
      NAKAMA_DOMAIN: ${NAKAMA_DOMAIN:?set NAKAMA_DOMAIN in .env.production}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env.production}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - faceoff_caddy_data:/data
      - faceoff_caddy_config:/config
    depends_on:
      nakama:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    networks:
      - faceoff

  prometheus:
    image: prom/prometheus:v2.53.1
    profiles:
      - observability
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - faceoff_prometheus:/prometheus
    depends_on:
      nakama:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    networks:
      - faceoff

volumes:
  faceoff_postgres_production:
  faceoff_caddy_data:
  faceoff_caddy_config:
  faceoff_prometheus:

networks:
  faceoff:
    name: faceoff-production-network
